name: workflow

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff
        with:
          enable-cache: false
      - run: uv sync --locked --all-extras --dev
      - run: uv run ruff format --check .
      - run: uv run ruff check .

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff
        with:
          enable-cache: false
      - run: uv sync --locked --all-extras --dev
      - run: uv run mypy src

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff
        with:
          enable-cache: false
      - run: uv sync --locked --all-extras --dev
      - run: uv run pytest tests/unit tests/integration tests/security tests/formal --cov=verification_ecology_kit --cov-report=term-missing

  property-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff
        with:
          enable-cache: false
      - run: uv sync --locked --all-extras --dev
      - run: uv run pytest tests/property --no-cov

  schema-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff
        with:
          enable-cache: false
      - run: uv sync --locked --all-extras --dev
      - run: uv run check-jsonschema --check-metaschema src/verification_ecology_kit/schemas/*.schema.json

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff
        with:
          enable-cache: false
      - run: uv sync --locked --all-extras --dev
      - run: uv run bandit -c pyproject.toml -r src scripts
      - run: uv run pip-audit
      - run: uv run python scripts/verify_no_secrets.py .
      - run: uv run python scripts/scan_local_info.py .
      - run: uvx zizmor .

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff
        with:
          enable-cache: false
      - run: uv sync --locked --all-extras --dev
      - run: uv run python scripts/generate_schema_docs.py
      - run: uv run python scripts/generate_theory_mapping.py
      - run: uv run python scripts/generate_capacity_schemas.py
      - run: uv run python scripts/generate_capacity_fixtures.py
      - run: git diff --exit-code -- docs src/verification_ecology_kit/schemas src/verification_ecology_kit/capacity/fixtures
      - run: uv run mkdocs build --strict

  formal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff
        with:
          enable-cache: false
      - run: uv sync --locked --all-extras --dev
      - run: curl --proto '=https' --tlsv1.2 -sSf -o elan-init.sh https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh
      - run: sh elan-init.sh -y --default-toolchain none
      - run: echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - run: uv run python scripts/generate_capacity_lean_traces.py
      - run: git diff --exit-code -- formal/lean/CapacityCore/Conformance.lean
      - run: cd formal/lean && lake build
      - run: if grep -R -E "sorry|admit|axiom" formal/lean/VETCore formal/lean/CapacityCore; then exit 1; fi
      - run: uv run python scripts/check_formal_coverage.py
      - run: uv run python scripts/check_formal_claims.py
      - run: uv run pytest tests/formal --no-cov
      - run: uv run python scripts/check_capacity_faults.py

  build:
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test, property-test, schema-check, security, docs, formal]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff
        with:
          enable-cache: false
      - run: uv sync --locked --all-extras --dev
      - run: uv run python scripts/check_v1_readiness.py --strict
      - run: uv build --no-sources
      - run: uv run python scripts/verify_package_contents.py
      - run: uv run python scripts/smoke_install_wheel.py
      - run: uv run python scripts/check_installed_capacity.py
      - run: uv run python scripts/artifact_manifest.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dist
          path: dist/*

  installed-platforms:
    needs: [build]
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: dist
          path: dist
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff
        with:
          enable-cache: false
      - run: uv run --no-project python scripts/check_installed_capacity.py

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: [build, installed-platforms]
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: dist
          path: dist
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff
        with:
          enable-cache: false
      - run: cd dist && sha256sum --check SHA256SUMS
      - run: uv publish --trusted-publishing always dist/*.whl dist/*.tar.gz
